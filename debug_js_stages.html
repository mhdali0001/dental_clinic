<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Treatment Stages JavaScript</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { border: 1px solid #ddd; padding: 15px; margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        pre { background: #f5f5f5; padding: 10px; border: 1px solid #ddd; }
        button { padding: 10px 15px; margin: 5px; background: #007cba; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Treatment Stages JavaScript Debug</h1>

    <div class="debug-section">
        <h2>1. Check DOM Elements</h2>
        <button onclick="checkDOMElements()">Check DOM Elements</button>
        <div id="domResults"></div>
    </div>

    <div class="debug-section">
        <h2>2. Test Treatment Stages Data</h2>
        <button onclick="testTreatmentStagesData()">Load Treatment Stages Data</button>
        <div id="dataResults"></div>
    </div>

    <div class="debug-section">
        <h2>3. Test JavaScript Functions</h2>
        <button onclick="testShowTreatmentStages()">Test showTreatmentStages Function</button>
        <div id="functionResults"></div>
    </div>

    <div class="debug-section">
        <h2>4. Console Output</h2>
        <p>Check browser console (F12) for any errors or warnings.</p>
        <button onclick="logDebugInfo()">Log Debug Info to Console</button>
    </div>

    <!-- Mock elements that would exist in treatment_new.php -->
    <div style="display: none;">
        <div id="treatmentStagesColumn">Treatment Stages Column</div>
        <div id="treatmentStages">Treatment Stages Container</div>
    </div>

    <script>
        // Mock treatment stages data (you can replace this with real data)
        let treatmentStages = {};
        let treatmentOptions = {};

        function checkDOMElements() {
            const results = document.getElementById('domResults');
            let html = '<h3>DOM Elements Check:</h3>';

            const elements = [
                'treatmentStagesColumn',
                'treatmentStages'
            ];

            elements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    html += `<p class="success">✅ ${id}: Found</p>`;
                } else {
                    html += `<p class="error">❌ ${id}: Missing</p>`;
                }
            });

            results.innerHTML = html;
        }

        async function testTreatmentStagesData() {
            const results = document.getElementById('dataResults');
            results.innerHTML = '<p>Loading treatment stages data...</p>';

            try {
                // Test the API endpoint
                const response = await fetch('doctor/treatment_stages_management.php?action=get_all');
                const data = await response.json();

                let html = '<h3>Treatment Stages API Response:</h3>';
                html += `<p><strong>Success:</strong> ${data.success ? '✅' : '❌'}</p>`;
                html += `<p><strong>Message:</strong> ${data.message || 'No message'}</p>`;
                html += `<p><strong>Data Count:</strong> ${data.data ? data.data.length : 0}</p>`;

                if (data.data && data.data.length > 0) {
                    html += '<h4>Sample Data:</h4>';
                    html += '<pre>' + JSON.stringify(data.data.slice(0, 3), null, 2) + '</pre>';

                    // Organize data like in treatment_new.php
                    const organizedStages = {};
                    data.data.forEach(stage => {
                        const optionId = stage.treatment_option_id;
                        if (!organizedStages[optionId]) {
                            organizedStages[optionId] = [];
                        }
                        organizedStages[optionId].push(stage);
                    });

                    html += '<h4>Organized by Option ID:</h4>';
                    html += '<pre>' + JSON.stringify(organizedStages, null, 2) + '</pre>';

                    // Update global variable for testing
                    treatmentStages = organizedStages;
                } else {
                    html += '<p class="warning">⚠️ No treatment stages data found</p>';
                }

                results.innerHTML = html;
            } catch (error) {
                results.innerHTML = `<p class="error">❌ Error loading data: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }

        function testShowTreatmentStages() {
            const results = document.getElementById('functionResults');
            let html = '<h3>Testing showTreatmentStages Function:</h3>';

            // Test with mock data
            if (Object.keys(treatmentStages).length === 0) {
                // Create mock data
                treatmentStages[1] = [
                    {title_ar: 'المرحلة الأولى', description_ar: 'وصف المرحلة الأولى', duration_ar: '30 دقيقة'},
                    {title_ar: 'المرحلة الثانية', description_ar: 'وصف المرحلة الثانية', duration_ar: '45 دقيقة'}
                ];
                html += '<p class="warning">⚠️ Using mock data for testing</p>';
            }

            // Test function logic
            const testOptionId = Object.keys(treatmentStages)[0];
            if (testOptionId) {
                const stages = treatmentStages[testOptionId];
                html += `<p class="success">✅ Found ${stages.length} stages for option ID ${testOptionId}</p>`;
                html += '<h4>Stages:</h4>';
                stages.forEach((stage, index) => {
                    html += `<p>${index + 1}. ${stage.title_ar} (${stage.duration_ar})</p>`;
                });
            } else {
                html += '<p class="error">❌ No treatment stages data available for testing</p>';
            }

            results.innerHTML = html;
        }

        function logDebugInfo() {
            console.log('=== Treatment Stages Debug Info ===');
            console.log('treatmentStages:', treatmentStages);
            console.log('treatmentOptions:', treatmentOptions);
            console.log('DOM Elements:');
            console.log('- treatmentStagesColumn:', document.getElementById('treatmentStagesColumn'));
            console.log('- treatmentStages:', document.getElementById('treatmentStages'));

            // Check for any JavaScript errors
            window.addEventListener('error', function(e) {
                console.error('JavaScript Error:', e.error);
            });

            alert('Debug info logged to console. Check F12 > Console tab.');
        }
    </script>
</body>
</html>
